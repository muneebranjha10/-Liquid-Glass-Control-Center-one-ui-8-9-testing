name: Build One UI 8 minimal hook candidate
on:
  push:
    paths:
      - '.github/workflows/build-oneui8-minimal.yml'
      - 'oneui8-minimal/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Android build tools available
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            echo 'Android build-tools already installed'
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'build-tools;36.0.0' 'platforms;android-36'
          fi
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Decode original APK
        run: |
          set -euo pipefail
          mkdir -p input build dist
          unzip -p CombineCC-Upload-This.zip input/Combine-CC-Geometry-Experimental.apk > input/original.apk
          echo 'd731fb16db3fee293148731fee962a49432c484dfc5490fea9c8ac94bcd8694c  input/original.apk' | sha256sum -c -
          unzip -t input/original.apk >/dev/null
          test "$(unzip -p input/original.apk assets/xposed_init)" = 'dev.colorcc.Hook'
          curl --fail --location --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar d -f -r input/original.apk -o build/decoded
      - name: Preserve original hooks and guard only one missing method
        run: |
          set -euo pipefail
          python3 oneui8-minimal/patch.py --decoded build/decoded --report build/patch-report.json
          java -jar apktool.jar b build/decoded -o build/rebuilt-unsigned.apk
      - name: Compile guard class (excluding compile-only Xposed stubs)
        run: |
          set -euo pipefail
          mkdir -p build/stubs/de/robv/android/xposed build/compiled build/dex
          unzip -p CombineCC-Upload-This.zip build-support/stubs/de/robv/android/xposed/XC_MethodHook.java > build/stubs/de/robv/android/xposed/XC_MethodHook.java
          unzip -p CombineCC-Upload-This.zip build-support/stubs/de/robv/android/xposed/XposedBridge.java > build/stubs/de/robv/android/xposed/XposedBridge.java
          cat > build/stubs/de/robv/android/xposed/XposedHelpers.java <<'EOF'
          package de.robv.android.xposed;
          public final class XposedHelpers {
              public static XC_MethodHook.Unhook findAndHookMethod(
                  Class<?> cls, String name, Object... args) { return null; }
          }
          EOF
          javac --release 8 -encoding UTF-8 -d build/compiled oneui8-minimal/SafeHooks.java build/stubs/de/robv/android/xposed/*.java
          jar cf build/guard.jar -C build/compiled dev/colorcc/compat
          if jar tf build/guard.jar | grep -q '^de/robv/android/xposed/'; then exit 1; fi
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 33 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output build/dex build/guard.jar
          cp build/dex/classes.dex build/classes2.dex
          cp build/rebuilt-unsigned.apk build/module-unsigned.apk
          (cd build && zip -q -9 module-unsigned.apk classes2.dex)
          unzip -t build/module-unsigned.apk >/dev/null
          test "$(unzip -p build/module-unsigned.apk assets/xposed_init)" = 'dev.colorcc.Hook'
          test "$(unzip -Z1 build/module-unsigned.apk | grep -Ec '^classes([0-9]+)?\.dex$')" -eq 2
      - name: Align and sign TEST APK
        env:
          KEY_B64: ${{ secrets.CC_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CC_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.CC_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.CC_KEY_PASS }}
        run: |
          set -euo pipefail
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOL/zipalign" -p -f 4 build/module-unsigned.apk build/aligned.apk
          "$TOOL/zipalign" -c -p 4 build/aligned.apk
          if [ -n "$KEY_B64" ]; then
            test -n "$KEY_ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS"
            printf %s "$KEY_B64" | base64 -d > build/signing.jks
            alias_name="$KEY_ALIAS"; store_pass="$STORE_PASS"; key_pass="$KEY_PASS"
          else
            keytool -genkeypair -noprompt -keystore build/signing.jks -alias test -storepass android -keypass android -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=CombineCC OneUI8 Minimal TEST'
            alias_name=test; store_pass=android; key_pass=android
          fi
          "$TOOL/apksigner" sign --ks build/signing.jks --ks-key-alias "$alias_name" --ks-pass "pass:$store_pass" --key-pass "pass:$key_pass" --out dist/CombineCC-OneUI8-Minimal-UNTESTED.apk build/aligned.apk
          "$TOOL/apksigner" verify --verbose --print-certs dist/CombineCC-OneUI8-Minimal-UNTESTED.apk
          unzip -t dist/CombineCC-OneUI8-Minimal-UNTESTED.apk >/dev/null
          sha256sum dist/CombineCC-OneUI8-Minimal-UNTESTED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CombineCC-OneUI8-Minimal-UNTESTED
          path: |
            dist/CombineCC-OneUI8-Minimal-UNTESTED.apk
            build/patch-report.json
          retention-days: 14
