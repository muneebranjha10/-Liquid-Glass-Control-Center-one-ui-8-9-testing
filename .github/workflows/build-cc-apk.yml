name: Build CombineCC APK (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cc-apk.yml'
      - 'CombineCC-Upload-This.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK (GitHub runner)
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager available"
          else
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -5
          fi
      - name: Install build tools and platform
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'build-tools;36.0.0' 'platforms;android-36'
      - name: Unpack source and build APK
        env:
          CC_KEYSTORE_BASE64: ${{ secrets.CC_KEYSTORE_BASE64 }}
          CC_KEY_ALIAS: ${{ secrets.CC_KEY_ALIAS }}
          CC_KEYSTORE_PASS: ${{ secrets.CC_KEYSTORE_PASS }}
          CC_KEY_PASS: ${{ secrets.CC_KEY_PASS }}
        run: |
          unzip -q 'CombineCC-Upload-This.zip' -d work
          cd work
          bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CombineCC-OneUI8-9-UNTESTED
          path: work/dist/CombineCC-OneUI8-9-UNTESTED.apk
          retention-days: 14
